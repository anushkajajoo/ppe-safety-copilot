[pytest]
testpaths = tests
addopts = -q

# Two deprecation warnings come from inside FastAPI/Starlette itself (its TestClient
# imports httpx, and anyio renamed BlockingPortal). They are not this project's code and
# nothing here can fix them short of pinning a different Starlette. They are silenced by
# name so the test output stays readable - and ONLY those two: any warning this project
# causes still shows up, which is the point of having warnings at all.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning
